name: Validate absolute-to-delta converter

on:
  push:
    branches:
      - "validation/add-delta-actions-converter"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy scipy pytest
      - name: Compile changed Python files
        run: |
          python -m py_compile             robomimic/scripts/conversion/robosuite_action_conversion.py             robomimic/scripts/conversion/robosuite_add_delta_actions.py             robomimic/scripts/conversion/convert_robosuite.py             robomimic/scripts/extract_action_dict.py             tests/test_robosuite_action_conversion.py
      - name: Run semantic round-trip tests
        run: python -m pytest -q tests/test_robosuite_action_conversion.py
