name: Robomimic action-dictionary robot preservation

on:
  push:
    branches: [fix/multi-arm-action-dict-lossless-extraction-20261015]
  pull_request:
    paths:
      - robomimic/scripts/extract_action_dict.py
      - tests/test_extract_action_dict_multi_robot.py

jobs:
  hdf5-action-extraction:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.2" "numpy>=1.24" "h5py>=3.8" "pytest>=8"
          python -m pip install -e . --no-deps
      - name: Run synthetic HDF5 action extraction regressions
        run: python -m pytest -q tests/test_extract_action_dict_multi_robot.py
